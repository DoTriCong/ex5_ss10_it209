services:
  database:
    image: postgres:15-alpine
    container_name: db-server
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # Chỉ mở cho máy host (localhost), không mở ra ngoài mạng
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    # Image giả lập Backend Web API (có thể thay bằng `build: .` nếu có Dockerfile)
    image: python:3.12-alpine
    container_name: app-container
    restart: unless-stopped
    command: python -m http.server 8080
    ports:
      - "${PORT}:8080"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend-net

volumes:
  pgdata:

networks:
  backend-net:
    driver: bridge
